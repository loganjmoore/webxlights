server {
    listen 10000;
    server_name _;

    # nginx defaults to 1MB, which 413s a real xlights_rgbeffects.xml import (and would
    # silently cap SequenceController's 50MB audio upload limit below what Laravel itself
    # allows). 100M covers both with headroom.
    client_max_body_size 100M;

    # DECISIONS.md: SharedArrayBuffer requires cross-origin isolation from day 1.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # SECURITY.md. The CSP is the one that matters: the app runs other people's GLSL on the
    # GPU by design, and this makes sure it never runs other people's JavaScript. Scripts come
    # only from this origin; styles allow inline because Vue writes style attributes; images and
    # media allow blob:/data: for the canvas exports and decoded audio; workers allow blob: for
    # the render pool. connect-src is open because FPP Connect talks to a controller on the
    # user's own LAN, at an address only they know.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src *; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Laravel API + Sanctum's CSRF cookie route go through PHP-FPM.
    location ~ ^/(api|sanctum|up)(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
    }

    # Everything else is the Vue SPA build: static assets, else index.html fallback.
    root /var/www/html/public/app;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
