server {
    listen 10000;
    server_name _;

    # DECISIONS.md: SharedArrayBuffer requires cross-origin isolation from day 1.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Laravel API + Sanctum's CSRF cookie route go through PHP-FPM.
    location ~ ^/(api|sanctum|up)(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
    }

    # Everything else is the Vue SPA build: static assets, else index.html fallback.
    root /var/www/html/public/app;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
