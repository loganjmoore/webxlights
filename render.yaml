databases:
  - name: webxlights-db
    plan: basic-1gb
    postgresMajorVersion: "17"

services:
  - type: web
    name: webxlights-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    disk:
      name: webxlights-audio
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: AUDIO_STORAGE_PATH
        value: /var/data/audio
      - key: APP_NAME
        value: pixl
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      # The custom domain. Attach pixl.community to this service in the Render dashboard, and
      # add it to SANCTUM_STATEFUL_DOMAINS there too, or the login cookie will not be accepted.
      - key: APP_URL
        value: https://pixl.community
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: webxlights-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      # The session cookie is the login. Secure + Lax so it never travels over plain HTTP and
      # never rides along on a cross-site POST (Sanctum's CSRF check is the second lock).
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_SAME_SITE
        value: lax
      - key: QUEUE_CONNECTION
        value: database
      # The shader assistant. Set manually in the dashboard rather than here, because it is a
      # secret - and left unset the app still runs: generation answers 503 and refunds the
      # credit, while every other part of the shader library works.
      - key: SHADER_API_KEY
        sync: false
      # Which provider writes the shaders, and with which model. The operator's key is an
      # OpenAI one, so the provider matches it; every supported provider speaks one shared wire
      # format, so switching is these two lines and a key. Note the measured caveat: the
      # bake-off (tools/shader-check/results/) measured Anthropic models only - gpt-5-mini's
      # compile rate is unmeasured, and docs/SHADER-ASSISTANT-COST.md explains why that number
      # is the one that matters. Run the corpus against it before trusting it long-term.
      - key: SHADER_PROVIDER
        value: anthropic
      - key: SHADER_MODEL
        value: claude-sonnet-5
      # The free allowance per signed-in person per calendar month. Bring-your-own-key callers
      # are not counted against it.
      - key: SHADER_MONTHLY_LIMIT
        value: "100"
      # Automatic lyric timing (OpenAI whisper-1 word timestamps). Set the key in the dashboard.
      - key: LYRICS_API_KEY
        sync: false
      - key: LYRICS_MONTHLY_LIMIT
        value: "20"
      # "Continue with Google". An OAuth client in Google Cloud, web application type, with
      # https://pixl.community/api/auth/google/callback as its redirect URI. Left unset, the
      # button is not offered.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # R2 + SANCTUM_STATEFUL_DOMAINS are set manually in the Render dashboard
      # (bucket/domain don't exist until M0's provisioning step is approved).

  - type: worker
    name: webxlights-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    dockerCommand: php artisan queue:work --tries=3
    envVars:
      - key: APP_KEY
        sync: false
      - key: DB_URL
        fromDatabase:
          name: webxlights-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
