name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # The production image is built from the same Dockerfile Render uses, so a base-image or
  # extension change that cannot build fails here instead of after it has merged.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: webxlights:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Check the shipped PHP configuration; Laravel fake uploads bypass PHP's parser.
      - name: Verify production upload limits
        run: >-
          docker run --rm --entrypoint php webxlights:ci -r
          '$upload = ini_parse_quantity(ini_get("upload_max_filesize"));
          $post = ini_parse_quantity(ini_get("post_max_size"));
          if ($upload < 50 * 1024 * 1024 || $post <= $upload) {
          fwrite(STDERR, "PHP must accept 50 MiB files with multipart overhead.\n"); exit(1); }'

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: webxlights
          POSTGRES_USER: webxlights
          POSTGRES_PASSWORD: webxlights
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
      - run: composer install --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      # phpunit.xml runs the suite against sqlite for speed; migrate against real
      # Postgres too so jsonb/pgsql-only migration mistakes don't slip through.
      - run: php artisan migrate --force
      - run: php artisan test
