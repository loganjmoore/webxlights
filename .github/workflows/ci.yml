name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # The production image is built from the same Dockerfile Render uses, so a base-image or
  # extension change that cannot build fails here instead of after it has merged.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: webxlights:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Check the shipped PHP configuration; Laravel fake uploads bypass PHP's parser.
      - name: Verify production upload limits
        run: >-
          docker run --rm --entrypoint php webxlights:ci -r
          '$upload = ini_parse_quantity(ini_get("upload_max_filesize"));
          $post = ini_parse_quantity(ini_get("post_max_size"));
          if ($upload < 50 * 1024 * 1024 || $post <= $upload) {
          fwrite(STDERR, "PHP must accept 50 MiB files with multipart overhead.\n"); exit(1); }'

      - name: Verify production TLS certificate checks
        run: |
          tls_dir=$(mktemp -d "$RUNNER_TEMP/tls-fixture.XXXXXX")
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1 -keyout "$tls_dir/key.pem" -out "$tls_dir/cert.pem" >/dev/null 2>&1
          openssl s_server -quiet -www -accept 127.0.0.1:18443 -cert "$tls_dir/cert.pem" -key "$tls_dir/key.pem" > "$tls_dir/server.log" 2>&1 &
          tls_pid=$!
          trap 'kill "$tls_pid" 2>/dev/null || true; rm -rf "$tls_dir"' EXIT
          for attempt in {1..30}; do
            if curl -fsS --cacert "$tls_dir/cert.pem" https://127.0.0.1:18443/ >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          curl -fsS --cacert "$tls_dir/cert.pem" https://127.0.0.1:18443/ >/dev/null
          docker run --rm --network host --mount "type=bind,source=$tls_dir/cert.pem,target=/tls-fixture.pem,readonly" --entrypoint php webxlights:ci -r '
          $errors = [];
          set_error_handler(function ($level, $message) use (&$errors) { $errors[] = $message; return true; });
          $response = file_get_contents("https://127.0.0.1:18443/", false, stream_context_create(["http" => ["timeout" => 5]]));
          restore_error_handler();
          if ($response !== false || !preg_match("/certificate verify failed/i", implode("\n", $errors))) { fwrite(STDERR, "Untrusted certificate must be rejected.\n"); exit(1); }
          $response = file_get_contents("https://127.0.0.1:18443/", false, stream_context_create(["ssl" => ["cafile" => "/tls-fixture.pem"], "http" => ["timeout" => 5]]));
          if ($response === false) { fwrite(STDERR, "Explicitly trusted fixture must connect.\n"); exit(1); }
          echo "Production TLS verification fixtures passed.\n";'

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: webxlights
          POSTGRES_USER: webxlights
          POSTGRES_PASSWORD: webxlights
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
      - run: composer install --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      # phpunit.xml runs the suite against sqlite for speed; migrate against real
      # Postgres too so jsonb/pgsql-only migration mistakes don't slip through.
      - run: php artisan migrate --force
      - run: php artisan test
