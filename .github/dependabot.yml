version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: composer
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # A new PHP or Node major is a decision, not an update: the runtime is locked in DECISIONS.md
    # and the image build is the only thing that tests it. Patch and minor tags still come through.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
