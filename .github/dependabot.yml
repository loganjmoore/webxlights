version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    # TypeScript majors land before typescript-eslint supports them, and one version in the group
    # outside the linter's peer range fails the whole group's install. Bumped by hand instead.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: composer
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # A new PHP or Node major is a decision, not an update: the runtime is locked in CLAUDE.md
    # and the image build is the only thing that tests it. Patch and minor tags still come through.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # php:8.5 tags as a minor but the opcache extension does not build on it yet (#115, #123).
      - dependency-name: php
        update-types: ["version-update:semver-minor"]
